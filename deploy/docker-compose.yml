# =============================================================================
# Sahara 本地开发环境
# 使用: docker compose -f deploy/docker-compose.yml up -d
# =============================================================================

services:
  # ── 基础设施 ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sahara
      POSTGRES_USER: sahara
      POSTGRES_PASSWORD: sahara_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahara"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── 应用服务 (可选：也可本地直接运行) ───────────────────
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      REDIS_URL: redis://redis:6379
      RUNTIME_ADDRS: runtime:50051
      LOG_LEVEL: debug
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - full  # docker compose --profile full up

  runtime:
    build:
      context: ../runtime
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    environment:
      SAHARA_GRPC_PORT: "50051"
      SAHARA_REDIS_URL: redis://redis:6379
      SAHARA_POSTGRES_DSN: postgresql://sahara:sahara_dev@postgres:5432/sahara
      SAHARA_LOG_LEVEL: DEBUG
      SAHARA_SANDBOX_ENABLED: "false"  # 容器内不启动嵌套 Docker
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles:
      - full

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      ADDR: ":8081"
    profiles:
      - full

volumes:
  redis_data:
  pg_data:
