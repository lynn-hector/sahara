[project]
name = "sahara-runtime"
version = "0.1.0"
description = "Sahara AI Agent Runtime — Python gRPC Worker"
requires-python = ">=3.11"
dependencies = [
    # gRPC
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
    "protobuf>=5.29.0",
    "grpcio-health-checking>=1.68.0",

    # LLM SDK
    "anthropic>=0.40.0",
    "openai>=1.57.0",

    # 异步
    "uvloop>=0.21.0",

    # Redis
    "redis[hiredis]>=5.2.0",

    # PostgreSQL
    "asyncpg>=0.30.0",

    # 沙箱 (docker provider)
    "docker>=7.1.0",

    # Token 计数
    "tiktoken>=0.8.0",

    # 配置
    "pydantic-settings>=2.6.0",

    # 日志
    "structlog>=24.4.0",

    # 指标
    "prometheus-client>=0.21.0",

    # YAML (skills frontmatter)
    "pyyaml>=6.0",

    # 工具
    "ulid-py>=1.1.0",
    "psutil>=6.1.0",
]

[project.optional-dependencies]
e2b = [
    "e2b>=2.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
